<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - UTEShop">UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<!-- Thông báo flash (redirect-after-post) -->
<div class="container flash" th:if="${success != null or error != null}">
    <div class="msg ok" th:if="${success != null}" th:text="${success}"></div>
    <div class="msg error" th:if="${error != null}" th:text="${error}"></div>
</div>

<main class="container" layout:fragment="content"></main>

<footer class="footer">Copyright &copy; UTEShop</footer>

</body>
</html>
