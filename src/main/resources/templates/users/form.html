<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">Form User</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">Form User</h1>

    <form class="form-card" th:object="${userDTO}" method="post" accept-charset="UTF-8"
          th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

        <div class="msg error" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <label for="username">Username</label>
        <input id="username" th:field="*{username}">
        <small class="error-text" th:errors="*{username}"></small>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="fullName">Họ tên</label>
        <input id="fullName" th:field="*{fullName}">
        <small class="error-text" th:errors="*{fullName}"></small>

        <label for="roleName">Role</label>
        <select id="roleName" th:field="*{roleName}">
            <option value="ROLE_USER">USER</option>
            <option value="ROLE_ADMIN">ADMIN</option>
        </select>

        <label class="check"><input type="checkbox" th:field="*{enabled}"> Kích hoạt (enabled)</label>

        <p th:if="${mode == 'create'}" class="note">
            Mật khẩu mặc định của user do Admin tạo: <b>123456</b>.
        </p>

        <div class="form-actions">
            <button class="button" type="submit">Lưu</button>
            <a class="button secondary" th:href="@{/users}">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
