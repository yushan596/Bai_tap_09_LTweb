<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h2>Đăng nhập</h2>

    <div class="msg error" th:if="${param.error}">Username/email hoặc password không đúng, hoặc tài khoản chưa xác nhận OTP</div>
    <div class="msg ok" th:if="${param.logout}">Bạn đã đăng xuất</div>
    <div class="msg ok" th:if="${success != null}" th:text="${success}"></div>

    <!-- th:action tự chèn CSRF token. Tên field mặc định của Spring Security: username / password -->
    <form th:action="@{/login}" method="post">
        <label for="username">Username hoặc Email</label>
        <input id="username" type="text" name="username" placeholder="Username hoặc email" required autofocus>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Password" required>

        <button type="submit">Đăng nhập</button>
    </form>

    <p class="auth-links"><a th:href="@{/register}">Tạo tài khoản</a></p>
    <p class="auth-links"><a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
</div>

</body>
</html>
