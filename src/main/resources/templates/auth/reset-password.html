<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>Đặt lại mật khẩu</h2>

    <div class="msg ok" th:if="${success != null}" th:text="${success}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <div class="msg error" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="otp">Mã OTP (6 số)</label>
        <input id="otp" th:field="*{otp}" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        <small class="error-text" th:errors="*{otp}"></small>

        <label for="password">Mật khẩu mới</label>
        <input id="password" type="password" th:field="*{password}">
        <small class="error-text" th:errors="*{password}"></small>

        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}">
        <small class="error-text" th:errors="*{confirmPassword}"></small>

        <button type="submit">Đổi mật khẩu</button>
    </form>

    <p class="auth-links"><a th:href="@{/forgot-password}">Gửi lại OTP</a></p>
    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
