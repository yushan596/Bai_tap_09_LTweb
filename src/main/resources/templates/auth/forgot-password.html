<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>Quên mật khẩu</h2>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <div class="msg error" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" autofocus>
        <small class="error-text" th:errors="*{email}"></small>

        <button type="submit">Gửi OTP</button>
    </form>

    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
