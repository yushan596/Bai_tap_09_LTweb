<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận OTP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>Xác nhận OTP</h2>

    <div class="msg ok" th:if="${success != null}" th:text="${success}"></div>
    <div class="msg error" th:if="${error != null}" th:text="${error}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <div class="msg error" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <small class="error-text" th:errors="*{email}"></small>

        <label for="otp">Mã OTP (6 số)</label>
        <input id="otp" th:field="*{otp}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" autofocus>
        <small class="error-text" th:errors="*{otp}"></small>

        <button type="submit">Xác nhận</button>
    </form>

    <form th:action="@{/resend-register-otp}" method="post">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button type="submit" class="secondary">Gửi lại OTP</button>
    </form>

    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
