<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <nav>
        <a class="brand" th:href="@{/}">UTEShop</a>

        <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
            <!-- Avatar -->
            <img class="avatar"
                 th:src="@{${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)
                             ? #authentication.principal.images
                             : '/images/avatar-default.png'}}"
                 alt="Avatar" width="40" height="40">

            <!-- Full name -->
            <span class="fullname" th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'">(nguyenvana)</span>
            <!-- Email -->
            <span th:text="${#authentication.principal.email}">email@gmail.com</span>
            <!-- Role -->
            <span class="role" th:text="${#authentication.principal.role}">ROLE_USER</span>

            <!-- Logout (th:action tự chèn CSRF token) -->
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Đăng xuất</button>
            </form>
        </div>

        <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
